# Training Configuration
# Used by train.py and train_gan.py via --config configs/train.yaml
# CLI arguments always override values defined here.

# ---------------------------------------------------------------------------
# Dataset paths
# ---------------------------------------------------------------------------
data:
  hr_dir: ~          # required
  lr_dir: ~          # required
  mask_dir: ~        # optional (leave as ~ for standard SR without masks)

# ---------------------------------------------------------------------------
# Model architecture
# ---------------------------------------------------------------------------
model:
  arch: unet         # rrdb | unet
  model_type: sft    # sft | mask_concat
  scale: 4
  num_feat: 64
  block_type: conv   # conv: standard 3×3 | clb: Collapsible Linear Block (SESR, unet only)
                     # clb trains expand(3×3)→squeeze(1×1); call collapse_clb() before deploy

# ---------------------------------------------------------------------------
# Training hyperparameters
# ---------------------------------------------------------------------------
train:
  epochs: 100
  batch_size: 4
  patch_size: 256    # HR crop size
  lr: 1.0e-4
  save_dir: experiments/run
  device: auto       # auto (detect cuda) | cuda | cpu

# ---------------------------------------------------------------------------
# Loss settings  (train.py & train_gan.py pixel-wise loss)
# ---------------------------------------------------------------------------
loss:
  hair_weight: 2.0      # Weight multiplier for hair/fur regions
  other_weight: 1.0     # Weight multiplier for non-hair regions
  use_perceptual: true  # Use VGG feature loss
  use_ssim: true        # Use Structural Similarity loss
  pixel_loss_type: l1   # Base pixel loss: l1 (Mean Absolute Error) | l2 (Mean Squared Error)

# ---------------------------------------------------------------------------
# GAN settings  (train_gan.py fine-tuning)
# ---------------------------------------------------------------------------
gan:
  pretrained_g: ~      # Path to warm-start generator (e.g. from train.py)
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  w_pixel: 1.0         # SegAwareLoss (pixel) weight
  w_perceptual: 1.0    # Multi-layer VGG19 perceptual loss weight
  w_adv: 0.1           # Adversarial loss weight (Generator side)
  gan_loss_type: vanilla # vanilla (BCE) | ragan | lsgan | hinge
  d_type: unet         # unet (Spectral Norm) | vgg (standard)
  d_feat: 64           # Discriminator base channels
  save_every: 5        # Save checkpoint every N epochs
  ema_decay: 0.999     # Exponential Moving Average decay for Generator weights
  milestones: [30, 60] # Epochs to decay LR
  gamma: 0.5           # LR decay multiplier
# ---------------------------------------------------------------------------
# Validation settings
# ---------------------------------------------------------------------------
validation:
  enabled: true
  val_lr_dir: ~        # Path to validation LR images
  val_mask_dir: ~      # optional (Path to validation masks)
  save_val_imgs: true  # Save SR results during validation
