
# SR Segmentation Configuration

device: cpu  # cuda or cpu

# Model paths (absolute or relative to project root)
models:
  speciesnet: models/speciesNet
  sam: models/sam_vit_h.pth
  bisenet: models/face_parsing.pth
  facexformer: models/facexfromer.pt  # note: typo in downloaded filename
  person_detector: models/yolov8n.pt

# SAM settings
sam:
  model_type: vit_h
  checkpoint: models/sam_vit_h.pth
  points_per_side: 32
  pred_iou_thresh: 0.88
  stability_score_thresh: 0.95
  min_mask_region_area: 100

# SpeciesNet settings
speciesnet:
  confidence_threshold: 0.5
  use_classifier: false  # true: filter non-mammal animals via EfficientNet V2 classifier (slower)

# Face parser selection: 'bisenet' or 'facexformer'
face_parser: bisenet

# BiSeNet settings
bisenet:
  num_classes: 19
  pretrained: face_parser

# Person detection
person_detector:
  model: yolov8n
  confidence_threshold: 0.5

# Texture classification (PR7)
texture_classifier:
  threshold: 0.5
  min_area: 200

# Mask merging
merging:
  gaussian_sigma: 3.0
  edge_blur_radius: 5
  min_hair_area: 100

# Processing
processing:
  max_image_size: 2048
  batch_size: 1

# Output
output:
  save_masks: true
  save_visualization: true
  output_dir: output

# SR Training (train.py / train_gan.py defaults)
training:
  # Generator architecture: 'rrdb' or 'unet'
  arch: unet
  # Mask integration mode: 'sft' (Spatial Feature Transform) or 'mask_concat' (4-ch input)
  model_type: sft
  scale: 4
  num_feat: 64
  patch_size: 256
  batch_size: 4
  epochs: 50
  lr: 1.0e-4
  hair_weight: 2.0
  other_weight: 1.0

# GAN-specific settings (train_gan.py)
gan:
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  w_pixel: 1.0        # seg-aware L1 pixel loss weight
  w_perceptual: 0.1   # VGG perceptual loss weight
  w_adv: 0.01         # adversarial loss weight (generator)
  d_feat: 64          # discriminator base channel count
  save_every: 5       # save checkpoint every N epochs
