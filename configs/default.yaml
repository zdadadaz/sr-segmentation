
# Segmentation Pipeline Configuration
# Controls the inference pipeline (SegmentationPipeline in src/pipeline.py).
# For SR training settings, see configs/train.yaml.

device: cpu  # cuda or cpu

# Model paths (absolute or relative to project root)
models:
  speciesnet: models/speciesNet
  sam: models/sam_vit_h.pth
  bisenet: models/face_parsing.pth
  facexformer: models/facexfromer.pt  # note: typo in downloaded filename
  person_detector: models/yolov8n.pt

# SAM settings
sam:
  model_type: vit_h
  checkpoint: models/sam_vit_h.pth
  points_per_side: 32
  pred_iou_thresh: 0.88
  stability_score_thresh: 0.95
  min_mask_region_area: 100

# SpeciesNet settings
speciesnet:
  confidence_threshold: 0.5
  use_classifier: true   # true: enables EfficientNet V2 classifier for species-level filtering (slower)

  # Taxonomy whitelist — only applies when use_classifier: true
  # Leave all lists empty (or omit) to keep default behaviour: mammalia only.
  # Each non-empty list acts as an allowlist for that level; ALL specified levels must match.
  # Ambiguous predictions (ANIMAL / UNKNOWN sentinel) are always kept conservatively.
  #
  # Taxonomy levels in the label file:
  #   UUID ; class ; order ; family ; genus ; species ; common_name
  #
  # Examples:
  #   class:  [mammalia]                        # all mammals (same as default)
  #   order:  [carnivora, rodentia]             # carnivores + rodents only
  #   family: [felidae, canidae, ursidae]       # cats, dogs, bears only
  #   genus:  [canis, felis]
  #   species: [lupus, catus]
  allowed_taxonomy:
    class: []
    order: []
    family: []
    genus: []
    species: []

# Face parser selection: 'bisenet' or 'facexformer'
face_parser: bisenet

# BiSeNet settings
bisenet:
  num_classes: 19
  pretrained: face_parser

# Person detection
person_detector:
  model: yolov8n
  confidence_threshold: 0.5

# Texture classification (PR7)
texture_classifier:
  threshold: 0.5
  min_area: 200

# Mask merging
merging:
  gaussian_sigma: 3.0
  edge_blur_radius: 5
  min_hair_area: 100

# Processing
processing:
  max_image_size: 2048
  batch_size: 1

# Output
output:
  save_masks: true
  save_visualization: true
  output_dir: output

